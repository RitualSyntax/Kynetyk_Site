name: Mirror app installers

# copies latest installers from each app repo into releases here
# releases sit on the empty downloads branch so "source code" zips are just a readme
# app repos need to be public, or set an APPS_TOKEN secret with read access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mirror-releases.yml']
  workflow_dispatch:
    inputs:
      apps:
        description: 'repos to copy, space separated'
        default: 'Kue vyz Kode konv dekk lynk rakk'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_TOKEN: ${{ secrets.APPS_TOKEN || github.token }}
      APPS: ${{ inputs.apps || 'Kue vyz Kode konv dekk lynk rakk' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: downloads
          fetch-depth: 0

      - name: Copy
        run: |
          set -e
          for r in $APPS; do
            app=$(echo $r | tr A-Z a-z)
            tag=$(GH_TOKEN=$SRC_TOKEN gh release view -R RitualSyntax/$r --json tagName -q .tagName)
            newtag="$app-$tag"
            echo "== $r $tag -> $newtag"
            have=$(gh release view $newtag --json assets -q '.assets[].name' 2>/dev/null || true)
            rm -rf dl && mkdir dl
            # installers only, skip updater files
            GH_TOKEN=$SRC_TOKEN gh release download $tag -R RitualSyntax/$r -D dl -p '*.exe' -p '*.dmg' -p '*.AppImage'
            for f in dl/*; do
              if echo "$have" | grep -qx "$(basename $f)"; then echo "  have $(basename $f)"; rm "$f"; fi
            done
            if [ -z "$have" ] && ! gh release view $newtag >/dev/null 2>&1; then
              gh release create $newtag dl/* --target downloads \
                --title "KYNETYK $app $tag" --notes "Installers for KYNETYK $app $tag. Download from https://kynetyk.gt.tc"
            elif [ -n "$(ls dl)" ]; then
              gh release upload $newtag dl/* --clobber
            fi
          done

      # old releases were tagged on main, move them all onto downloads
      - name: Retag onto downloads
        run: |
          git fetch -q --tags --force
          for t in $(git tag -l '*-v*'); do git tag -f "$t" HEAD >/dev/null; done
          git push -f origin --tags
