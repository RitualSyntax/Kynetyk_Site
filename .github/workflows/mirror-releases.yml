name: Mirror app installers

# copies latest installers from each app repo into releases here
# releases sit on the empty downloads branch so "source code" zips are just a readme
# app repos need to be public, or set an APPS_TOKEN secret with read access
# runs when this file changes on main, or by hand from the actions tab
on:
  push:
    branches: [main]
    paths: ['.github/workflows/mirror-releases.yml']
  workflow_dispatch:
    inputs:
      apps:
        description: 'repos to copy, space separated'
        default: 'Kue vyz Kode konv dekk lynk rakk mapp kast'

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SRC_TOKEN: ${{ secrets.APPS_TOKEN || github.token }}
      APPS: ${{ inputs.apps || 'Kue vyz Kode konv dekk lynk rakk mapp kast' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: downloads
          fetch-depth: 0

      - name: Copy
        run: |
          for r in $APPS; do
            app=$(echo $r | tr A-Z a-z)
            # latest release on the app repo, skip the app if it cant be read
            rel=$(GH_TOKEN=$SRC_TOKEN gh api repos/RitualSyntax/$r/releases/latest) || { echo "!! cant read $r, skipping"; continue; }
            tag=$(echo "$rel" | jq -r .tag_name)
            newtag="$app-$tag"
            echo "== $r $tag -> $newtag"
            have=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/$newtag -q '.assets[].name' 2>/dev/null || true)
            rm -rf dl && mkdir dl
            # installers only (kast is plain binaries + a mac zip), skip ones already here
            echo "$rel" | jq -r '.assets[] | select(.name|test("\\.(exe|dmg|AppImage|zip)$|-linux$")) | "\(.id) \(.name)"' | while read id name; do
              if echo "$have" | grep -qx "$name"; then echo "  have $name"; continue; fi
              echo "  get $name"
              GH_TOKEN=$SRC_TOKEN gh api -H "Accept: application/octet-stream" repos/RitualSyntax/$r/releases/assets/$id > "dl/$name"
            done
            [ -n "$(ls dl)" ] || continue
            if gh release view $newtag >/dev/null 2>&1; then
              gh release upload $newtag dl/* --clobber
            else
              gh release create $newtag dl/* --target downloads \
                --title "KYNETYK $app $tag" --notes "Installers for KYNETYK $app $tag. Download from https://kynetyk.gt.tc"
            fi
          done

      # old releases were tagged on main, move them all onto downloads
      - name: Retag onto downloads
        if: always()
        run: |
          git fetch -q --tags --force
          for t in $(git tag -l '*-v*'); do git tag -f "$t" HEAD >/dev/null; done
          git push -f origin --tags
